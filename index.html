<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria da Galera</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #e0f2fe, #f0f9ff);
    color: #0f172a;
    overflow-x: hidden;
}

header{
    text-align: center;
    padding: 60px 20px;
    background: linear-gradient(135deg, #0284c7, #0369a1);
    color: white;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    border-bottom-left-radius: 30px;
    border-bottom-right-radius: 30px;
    margin-bottom: 40px;
}

header h1{
    font-size: 3rem;
    margin-bottom: 15px;
    letter-spacing: -1px;
}

header p{
    font-size: 1.2rem;
    opacity: 0.9;
}

section{
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

h2{
    text-align: center;
    margin-bottom: 30px;
    color: #0369a1;
    font-size: 2rem;
}

.mural-amigos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    margin-top: 20px;
}

.card-amigo {
    background: white;
    border-radius: 20px;
    padding: 15px;
    box-shadow: 0 10px 25px rgba(2, 132, 199, 0.08);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card-amigo:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 30px rgba(2, 132, 199, 0.15);
}

.card-amigo img {
    width: 100%;
    height: auto;
    max-height: 350px;
    object-fit: cover;
    border-radius: 12px;
}

.secao-botao {
    text-align: center;
    padding: 40px 20px;
}

.btn-galeria {
    display: inline-block;
    background: #0284c7;
    color: white;
    text-decoration: none;
    padding: 16px 35px;
    border-radius: 30px;
    font-weight: bold;
    font-size: 1.1rem;
    box-shadow: 0 6px 20px rgba(2, 132, 199, 0.3);
    transition: all 0.3s ease;
}

.btn-galeria:hover {
    background: #0369a1;
    transform: scale(1.05);
    box-shadow: 0 8px 25px rgba(2, 132, 199, 0.4);
}

footer{
    text-align: center;
    padding: 40px;
    font-size: 1rem;
    color: #475569;
    background: #f8fafc;
    margin-top: 50px;
    border-top: 1px solid #e2e8f0;
}

.estrela {
    position: fixed;
    color: #38bdf8;
    font-size: 18px;
    animation: cair linear infinite;
    top: -10px;
    z-index: 1000;
    opacity: 0.7;
}

@keyframes cair {
    0% {
        transform: translateY(-10px) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0.2;
    }
}
</style>
</head>
<body>

<header>

<script>
function criarEstrela(){
    const estrela = document.createElement("div");
    estrela.classList.add("estrela");
    estrela.innerHTML = "⭐";
    estrela.style.left = Math.random() * 100 + "vw";
    estrela.style.animationDuration = (4 + Math.random() * 4) + "s";
    document.body.appendChild(estrela);

    setTimeout(() => {
        estrela.remove();
    }, 8000);
}

setInterval(criarEstrela, 400);
</script>
