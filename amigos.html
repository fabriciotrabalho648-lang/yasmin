<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nossa Galera ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#ffd6e7,#ffeef5);
    color:#5c2c40;
    overflow-x:hidden;
}

header{
    text-align:center;
    padding:50px 20px;
}

header h1{
    font-size:2.5rem;
    margin-bottom:15px;
    color:#d63384;
}

header p{
    font-size:1.2rem;
}

section{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.btn-voltar {
    display: inline-block;
    background: #5c2c40;
    color: white;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 20px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    transition: 0.3s;
}

.btn-voltar:hover {
    background: #d63384;
}

.mural-amigos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.card-amigo {
    background: white;
    border-radius: 20px;
    padding: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
    display: flex;
    align-items: center;
    justify-content: center;
}

.card-amigo img {
    width: 100%;
    height: auto;
    max-height: 400px;
    object-fit: cover;
    border-radius: 12px;
}

footer {
    text-align:center;
    padding:40px;
    font-size:1.1rem;
}

.heart{
    position:fixed;
    color:#ff4d94;
    font-size:20px;
    animation:fall linear infinite;
    top:-10px;
}

@keyframes fall{
    to{
        transform:translateY(110vh);
    }
}
</style>
</head>

<body>

<header>
    <a href="index.html" class="btn-voltar">⬅ Voltar para o início</a>
    <h1>✨ Cantinho dos Amigos</h1>
    <p>Porque os nossos melhores momentos com a galera ficam guardados aqui!</p>
</header>

<script>
function criarCoracao(){
    const coracao = document.createElement("div");
    coracao.classList.add("heart");
    coracao.innerHTML = "❤️";
    coracao.style.left = Math.random() * 100 + "vw";
    coracao.style.animationDuration = (3 + Math.random()*5) + "s";
    document.body.appendChild(coracao);

    setTimeout(()=>{
        coracao.remove();
    },8000);
}
setInterval(criarCoracao,300);
</script>
